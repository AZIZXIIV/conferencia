<section class="card" id="notifications">
  <div class="icon">🔔</div>
  <div>
    <h2>Zone de notifications</h2>
    <p>Vous avez {{ notifications.length }} nouvelles notifications.</p>

    <button type="button" (click)="toggleNotifications()">
      {{ showNotifications ? 'Masquer' : 'Afficher' }} les notifications
    </button>

    @if (showNotifications) {
      @for (notif of notifications; track $index) {
        <p class="notification">{{ notif }}</p>
      }
    }
  </div>
</section>
